name: Bad Idea Machine Reference Regression

on:
  push:
    branches:
      - main
      - feat/reference-locked-cinematic-rebuild
    paths:
      - .github/workflows/visual-smoke.yml
      - sdk/casino-sdk/examples/bad-idea-machine/src/**
      - sdk/casino-sdk/examples/bad-idea-machine/public/**
      - sdk/casino-sdk/examples/bad-idea-machine/scripts/visual-regression.mjs
      - sdk/casino-sdk/examples/bad-idea-machine/index.html

permissions:
  contents: read

jobs:
  reference-regression:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/casino-sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install workspace
        run: npm ci

      - name: Install Playwright Chromium
        shell: bash
        run: |
          cd examples/bad-idea-machine
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Verify authored room and foley assets
        shell: bash
        run: |
          npm --prefix examples/bad-idea-machine run verify-room-assets
          npm --prefix examples/bad-idea-machine run verify-audio-assets

      - name: Build and serve standalone demo
        shell: bash
        run: |
          npm run build:bad-idea
          npm --prefix examples/bad-idea-machine run preview -- --host 127.0.0.1 > /tmp/bad-idea-preview.log 2>&1 &
          echo $! > /tmp/bad-idea-preview.pid
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3100 >/dev/null; then
              exit 0
            fi
            sleep 0.25
          done
          cat /tmp/bad-idea-preview.log
          exit 1

      - name: Run reference-locked visual regression
        shell: bash
        run: |
          cd examples/bad-idea-machine
          BIM_BASE_URL=http://127.0.0.1:3100 node scripts/visual-regression.mjs

      - name: Upload visual regression screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bad-idea-machine-reference-regression
          path: sdk/casino-sdk/examples/bad-idea-machine/visual-regression/*.png
          if-no-files-found: warn
