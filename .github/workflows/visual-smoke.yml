name: Bad Idea Machine Visual Smoke

# Chaos-pass gate: assert the live reveal contains decoys, particles, major hazards, and no browser errors.
on:
  push:
    branches:
      - main
      - feat/bad-idea-machine-game
      - feat/chaos-unpredictability-pass
    paths:
      - .github/workflows/visual-smoke.yml
      - sdk/casino-sdk/examples/bad-idea-machine/src/**
      - sdk/casino-sdk/examples/bad-idea-machine/public/**
      - sdk/casino-sdk/examples/bad-idea-machine/index.html

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/casino-sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install workspace
        run: npm install

      - name: Install Playwright for visual smoke
        shell: bash
        run: |
          cd examples/bad-idea-machine
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Build and serve standalone demo
        shell: bash
        run: |
          npm run build:bad-idea
          npm --prefix examples/bad-idea-machine run preview -- --host 127.0.0.1 > /tmp/bad-idea-preview.log 2>&1 &
          echo $! > /tmp/bad-idea-preview.pid
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3100 >/dev/null; then
              exit 0
            fi
            sleep 0.25
          done
          cat /tmp/bad-idea-preview.log
          exit 1

      - name: Capture ready, live chaos, result and mobile
        shell: bash
        run: |
          cd examples/bad-idea-machine
          mkdir -p visual-smoke
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';

          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 1440, height: 900 }, deviceScaleFactor: 1 });
          const consoleErrors = [];
          page.on('console', message => {
            if (message.type() === 'error') consoleErrors.push(message.text());
          });
          page.on('pageerror', error => consoleErrors.push(error.message));

          await page.goto('http://127.0.0.1:3100', { waitUntil: 'networkidle' });
          await page.getByText('BAD IDEA MACHINE', { exact: true }).first().waitFor();
          await page.screenshot({ path: 'visual-smoke/desktop-ready.png', fullPage: true });

          await page.getByRole('button', { name: /ABSOLUTELY NOT/i }).click();
          await page.screenshot({ path: 'visual-smoke/desktop-danger.png', fullPage: true });

          await page.getByRole('button', { name: /DO NOT PRESS/i }).click();
          await page.waitForTimeout(300);
          await page.locator('.machine--revealing').waitFor();
          await page.locator('.chaos-layer').waitFor();
          if (await page.locator('.chaos-particle').count() < 30) throw new Error('Dense chaos particle field did not render');
          if (await page.locator('.station--active').count() !== 1) throw new Error('Exactly one authoritative active station is required');
          if (await page.locator('.station--decoy').count() < 1) throw new Error('Expected at least one false-alarm station');
          await page.screenshot({ path: 'visual-smoke/desktop-chaos-early.png', fullPage: true });

          await page.waitForFunction(() => {
            const station = document.querySelector('.station--active');
            return station?.getAttribute('data-hazard') === 'fire' || station?.getAttribute('data-hazard') === 'blast';
          }, undefined, { timeout: 6_500 });
          if (await page.locator('.station__fire').count() < 1) throw new Error('Major hazard did not render visible fire');
          await page.screenshot({ path: 'visual-smoke/desktop-chaos-fire-blast.png', fullPage: true });

          await page.waitForTimeout(900);
          await page.screenshot({ path: 'visual-smoke/desktop-chaos-mid.png', fullPage: true });

          await page.getByText('WHAT WENT WRONG?', { exact: true }).waitFor({ timeout: 8_000 });
          await page.screenshot({ path: 'visual-smoke/desktop-result.png', fullPage: true });

          const mobile = await browser.newPage({ viewport: { width: 390, height: 844 }, deviceScaleFactor: 1 });
          mobile.on('console', message => {
            if (message.type() === 'error') consoleErrors.push(`mobile: ${message.text()}`);
          });
          mobile.on('pageerror', error => consoleErrors.push(`mobile: ${error.message}`));
          await mobile.goto('http://127.0.0.1:3100', { waitUntil: 'networkidle' });
          await mobile.getByText('BAD IDEA MACHINE', { exact: true }).first().waitFor();
          await mobile.screenshot({ path: 'visual-smoke/mobile-ready.png', fullPage: true });
          await mobile.getByRole('button', { name: /SEND IT/i }).click();
          await mobile.getByRole('button', { name: /DO NOT PRESS/i }).click();
          await mobile.waitForTimeout(500);
          await mobile.locator('.chaos-layer').waitFor();
          if (await mobile.locator('.chaos-particle').count() < 30) throw new Error('Mobile chaos field did not render densely enough');
          await mobile.screenshot({ path: 'visual-smoke/mobile-chaos.png', fullPage: true });

          if (consoleErrors.length > 0) {
            throw new Error(`Browser errors:\n${consoleErrors.join('\n')}`);
          }
          await browser.close();
          NODE

      - name: Upload visual smoke screenshots
        uses: actions/upload-artifact@v4
        with:
          name: bad-idea-machine-visual-smoke
          path: sdk/casino-sdk/examples/bad-idea-machine/visual-smoke/*.png
          if-no-files-found: error
