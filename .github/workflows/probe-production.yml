name: Probe Bad Idea Machine Production

on:
  push:
    branches:
      - feat/chaos-unpredictability-pass
    paths:
      - .github/workflows/probe-production.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Capture production response
        shell: bash
        run: |
          set -u
          mkdir -p probe-output
          BASE='https://bad-idea-machine-oyebisiayobami26-7089s-projects.vercel.app'

          curl --silent --show-error --head --location --retry 5 --retry-delay 2 "$BASE/" > probe-output/headers.txt 2>&1 || true
          INDEX_CODE="$(curl --silent --show-error --location --retry 5 --retry-delay 2 -o probe-output/index.html -w '%{http_code}' "$BASE/" || echo CURL_ERROR)"
          MANIFEST_CODE="$(curl --silent --show-error --location --retry 5 --retry-delay 2 -o probe-output/game.manifest.json -w '%{http_code}' "$BASE/game.manifest.json" || echo CURL_ERROR)"

          JS_PATH="$(grep -oE '/assets/index-[A-Za-z0-9_-]+\.js' probe-output/index.html | head -1 || true)"
          CSS_PATH="$(grep -oE '/assets/index-[A-Za-z0-9_-]+\.css' probe-output/index.html | head -1 || true)"

          {
            echo "base=$BASE"
            echo "index_http=$INDEX_CODE"
            echo "manifest_http=$MANIFEST_CODE"
            echo "live_js=$JS_PATH"
            echo "live_css=$CSS_PATH"
            echo "expected_js=/assets/index-fg5H4bbd.js"
            echo "expected_css=/assets/index-Y-RzVO_v.css"
          } > probe-output/summary.txt

          if [[ -n "$JS_PATH" ]]; then
            curl --silent --show-error --head --location "$BASE$JS_PATH" > probe-output/js-headers.txt 2>&1 || true
          fi
          if [[ -n "$CSS_PATH" ]]; then
            curl --silent --show-error --head --location "$BASE$CSS_PATH" > probe-output/css-headers.txt 2>&1 || true
          fi

          cat probe-output/summary.txt

      - name: Upload production diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-probe
          path: probe-output
          if-no-files-found: error
