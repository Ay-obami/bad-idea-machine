name: Fetch Cinematic Reference Assets

on:
  push:
    branches:
      - feat/cinematic-reference-ui
    paths:
      - .github/workflows/fetch-cinematic-assets.yml

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cinematic branch
        uses: actions/checkout@v4
        with:
          ref: feat/cinematic-reference-ui

      - name: Download optimized room photography
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p sdk/casino-sdk/examples/bad-idea-machine/public/cinematic
          curl --fail --location --retry 4 --retry-delay 2 \
            'https://images.unsplash.com/photo-1784039534969-26e424548f3e?auto=format&fit=crop&fm=webp&q=68&w=1600' \
            -o sdk/casino-sdk/examples/bad-idea-machine/public/cinematic/kitchen.webp
          curl --fail --location --retry 4 --retry-delay 2 \
            'https://images.unsplash.com/photo-1763202282638-371d7060ee51?auto=format&fit=crop&fm=webp&q=68&w=1600' \
            -o sdk/casino-sdk/examples/bad-idea-machine/public/cinematic/garage.webp
          curl --fail --location --retry 4 --retry-delay 2 \
            'https://images.unsplash.com/photo-1768889097721-cbe9741445bd?auto=format&fit=crop&fm=webp&q=60&w=1400' \
            -o sdk/casino-sdk/examples/bad-idea-machine/public/cinematic/blast.webp

          for file in sdk/casino-sdk/examples/bad-idea-machine/public/cinematic/*.webp; do
            bytes=$(wc -c < "$file")
            echo "$file: $bytes bytes"
            test "$bytes" -gt 10000
            test "$bytes" -lt 900000
          done

      - name: Commit cinematic assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sdk/casino-sdk/examples/bad-idea-machine/public/cinematic
          if git diff --cached --quiet; then
            echo 'Assets already current.'
            exit 0
          fi
          git commit -m 'assets: vendor cinematic room photography'
          git push origin HEAD:feat/cinematic-reference-ui
