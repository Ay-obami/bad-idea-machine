name: Probe Bad Idea Machine Production

on:
  push:
    branches:
      - feat/chaos-unpredictability-pass
    paths:
      - .github/workflows/probe-production.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect production alias and verify merged chaos build
        shell: bash
        run: |
          set -u
          BASE='https://bad-idea-machine-oyebisiayobami26-7089s-projects.vercel.app'
          echo '--- response headers ---'
          curl --silent --show-error --head --location --retry 5 --retry-delay 2 "$BASE/" || true
          echo '--- current index ---'
          HTML="$(curl --fail --silent --show-error --location --retry 5 --retry-delay 2 "$BASE/")" || exit 10
          printf '%s\n' "$HTML"
          echo '--- manifest ---'
          curl --fail --silent --show-error --location --retry 5 --retry-delay 2 "$BASE/game.manifest.json" | tee /tmp/manifest.json || exit 11
          echo
          echo '--- expected exact asset checks ---'
          STATUS=0
          printf '%s\n' "$HTML" | grep -F '/assets/index-fg5H4bbd.js' || STATUS=21
          printf '%s\n' "$HTML" | grep -F '/assets/index-Y-RzVO_v.css' || STATUS=22
          grep -F '"gameId": "BadIdeaMachineGame"' /tmp/manifest.json || STATUS=23
          grep -F '"name": "Bad Idea Machine"' /tmp/manifest.json || STATUS=24
          if [[ "$STATUS" -eq 0 ]]; then
            curl --fail --silent --show-error --head --location "$BASE/assets/index-fg5H4bbd.js" || STATUS=25
            curl --fail --silent --show-error --head --location "$BASE/assets/index-Y-RzVO_v.css" || STATUS=26
          fi
          if [[ "$STATUS" -eq 0 ]]; then
            echo 'PASS production alias serves exact verified chaos bundle'
          else
            echo "FAIL production alias mismatch status=$STATUS"
          fi
          exit "$STATUS"
