name: Bad Idea Machine Feature CI

on:
  push:
    branches:
      - feat/bad-idea-machine-game
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/casino-sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sdk/casino-sdk/package.json

      - name: Install dependencies
        run: npm install

      - name: Run Bad Idea Machine unit tests
        run: npm run test:bad-idea

      - name: Typecheck Bad Idea Machine
        run: npm --prefix examples/bad-idea-machine run check-types

      - name: Build Bad Idea Machine
        run: npm run build:bad-idea
