name: Bootstrap Chain Casino SDK

on:
  push:
    branches:
      - feat/bad-idea-machine-game
    paths:
      - .github/workflows/bootstrap-sdk.yml

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download and vendor current Chain casino SDK
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://sdk.chain.wtf/sdk/casino-sdk.zip -o /tmp/casino-sdk.zip
          python - <<'PY'
          import json, shutil, tempfile
          from pathlib import Path
          from zipfile import ZipFile

          archive = Path('/tmp/casino-sdk.zip')
          tmp = Path(tempfile.mkdtemp(prefix='chain-casino-sdk-'))
          with ZipFile(archive) as z:
              z.extractall(tmp)

          candidates = []
          for package in tmp.rglob('package.json'):
              try:
                  data = json.loads(package.read_text())
              except Exception:
                  continue
              if data.get('name') == '@chain/casino-sdk':
                  candidates.append(package.parent)

          if len(candidates) != 1:
              raise SystemExit(f'Expected exactly one @chain/casino-sdk package, found {len(candidates)}')

          dest = Path('sdk/casino-sdk')
          if dest.exists():
              shutil.rmtree(dest)
          dest.parent.mkdir(parents=True, exist_ok=True)
          shutil.copytree(candidates[0], dest)
          print(f'Vendored {candidates[0]} -> {dest}')
          PY

      - name: Create Bad Idea Machine workspace from coinflip reference
        shell: bash
        run: |
          set -euo pipefail
          test -d sdk/casino-sdk/examples/coinflip-public
          rm -rf sdk/casino-sdk/examples/bad-idea-machine
          cp -R sdk/casino-sdk/examples/coinflip-public sdk/casino-sdk/examples/bad-idea-machine

          node <<'NODE'
          const fs = require('node:fs');
          const gamePath = 'sdk/casino-sdk/examples/bad-idea-machine/package.json';
          const game = JSON.parse(fs.readFileSync(gamePath, 'utf8'));
          game.name = 'bad-idea-machine';
          game.scripts = {
            ...game.scripts,
            simulate: 'node scripts/simulate-flows.mjs',
            'verify-build': 'node scripts/verify-build.mjs'
          };
          fs.writeFileSync(gamePath, JSON.stringify(game, null, 2) + '\n');

          const rootPath = 'sdk/casino-sdk/package.json';
          const root = JSON.parse(fs.readFileSync(rootPath, 'utf8'));
          root.scripts = {
            ...root.scripts,
            'start:bad-idea': 'concurrently -k -n local-node,simulator,bad-idea -c yellow,cyan,magenta "npm --prefix simulator run local-node" "npm --prefix simulator run dev" "npm --prefix examples/bad-idea-machine run dev"',
            'test:bad-idea': 'npm --prefix examples/bad-idea-machine test',
            'build:bad-idea': 'npm --prefix examples/bad-idea-machine run build',
            'simulate:bad-idea': 'npm --prefix examples/bad-idea-machine run simulate'
          };
          fs.writeFileSync(rootPath, JSON.stringify(root, null, 2) + '\n');
          NODE

      - name: Commit vendored SDK foundation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Bad Idea Machine Bot"
          git config user.email "actions@users.noreply.github.com"
          git add sdk/casino-sdk
          if git diff --cached --quiet; then
            echo "No SDK changes to commit"
            exit 0
          fi
          git commit -m "chore: bootstrap Chain casino SDK"
          git push origin HEAD:feat/bad-idea-machine-game
