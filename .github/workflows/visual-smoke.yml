name: Bad Idea Machine Visual Smoke

on:
  push:
    branches:
      - main
      - feat/bad-idea-machine-game
      - feat/chaos-unpredictability-pass
      - feat/environment-scene-rebuild
    paths:
      - .github/workflows/visual-smoke.yml
      - sdk/casino-sdk/examples/bad-idea-machine/src/**
      - sdk/casino-sdk/examples/bad-idea-machine/public/**
      - sdk/casino-sdk/examples/bad-idea-machine/index.html

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/casino-sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install workspace
        run: npm install

      - name: Install Playwright for visual smoke
        shell: bash
        run: |
          cd examples/bad-idea-machine
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Build and serve standalone demo
        shell: bash
        run: |
          npm run build:bad-idea
          npm --prefix examples/bad-idea-machine run preview -- --host 127.0.0.1 > /tmp/bad-idea-preview.log 2>&1 &
          echo $! > /tmp/bad-idea-preview.pid
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3100 >/dev/null; then
              exit 0
            fi
            sleep 0.25
          done
          cat /tmp/bad-idea-preview.log
          exit 1

      - name: Capture both rooms and verify physical actor motion
        shell: bash
        run: |
          cd examples/bad-idea-machine
          mkdir -p visual-smoke
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';

          const browser = await chromium.launch({ headless: true });
          const consoleErrors = [];

          async function verifyMovingActor(page) {
            await page.locator('.environment-stage[data-phase="revealing"]').waitFor({ timeout: 4_000 });
            const probe = page.locator('[data-event-actor]').first();
            await probe.waitFor({ state: 'attached', timeout: 4_000 });
            const actorId = await probe.getAttribute('data-event-actor');
            if (!actorId) throw new Error('Active scene event did not expose an actor id');
            const actor = page.locator(`[data-scene-actor="${actorId}"]`);
            const first = await actor.boundingBox();
            await page.waitForTimeout(260);
            const second = await actor.boundingBox();
            if (!first || !second) throw new Error(`Could not measure moving actor ${actorId}`);
            const distance = Math.hypot(second.x - first.x, second.y - first.y);
            if (distance < 18) throw new Error(`Actor ${actorId} only moved ${distance.toFixed(1)}px; expected real screen travel`);
            return actorId;
          }

          async function verifyChaos(page) {
            await page.locator('.scene-vfx-layer').waitFor();
            await page.waitForFunction(() => document.querySelectorAll('.scene-particle').length >= 30, undefined, { timeout: 4_000 });
            await page.waitForFunction(() => {
              const probes = [...document.querySelectorAll('[data-event-hazard]')];
              return probes.some(node => ['fire','blast'].includes(node.getAttribute('data-event-hazard') || ''));
            }, undefined, { timeout: 6_500 });
            await page.locator('.scene-flame').first().waitFor({ timeout: 2_000 });
          }

          const page = await browser.newPage({ viewport: { width: 1440, height: 900 }, deviceScaleFactor: 1 });
          page.on('console', message => { if (message.type() === 'error') consoleErrors.push(message.text()); });
          page.on('pageerror', error => consoleErrors.push(error.message));

          await page.goto('http://127.0.0.1:3100', { waitUntil: 'networkidle' });
          await page.getByText('BAD IDEA MACHINE', { exact: true }).first().waitFor();
          if (await page.locator('.station').count() !== 0) throw new Error('Old station-card UI is still rendered');
          if (await page.locator('[data-environment="kitchen"]').count() < 1) throw new Error('Kitchen environment did not render by default');
          await page.screenshot({ path: 'visual-smoke/desktop-kitchen-ready.png', fullPage: true });

          await page.getByRole('button', { name: /ABSOLUTELY NOT/i }).click();
          await page.getByRole('button', { name: /DO NOT PRESS/i }).click();
          const kitchenActor = await verifyMovingActor(page);
          await verifyChaos(page);
          console.log(`Kitchen moving actor: ${kitchenActor}`);
          await page.screenshot({ path: 'visual-smoke/desktop-kitchen-chaos.png', fullPage: true });
          await page.getByText('WHAT WENT WRONG?', { exact: true }).waitFor({ timeout: 9_000 });
          await page.screenshot({ path: 'visual-smoke/desktop-kitchen-result.png', fullPage: true });

          await page.getByRole('button', { name: /GARAGE MAYHEM/i }).click();
          await page.locator('.environment-stage[data-environment="garage"]').waitFor();
          await page.screenshot({ path: 'visual-smoke/desktop-garage-ready.png', fullPage: true });
          await page.getByRole('button', { name: /PRESS AGAIN|DO NOT PRESS/i }).click();
          const garageActor = await verifyMovingActor(page);
          await verifyChaos(page);
          console.log(`Garage moving actor: ${garageActor}`);
          await page.screenshot({ path: 'visual-smoke/desktop-garage-chaos.png', fullPage: true });
          await page.getByText('WHAT WENT WRONG?', { exact: true }).waitFor({ timeout: 9_000 });

          const mobile = await browser.newPage({ viewport: { width: 390, height: 844 }, deviceScaleFactor: 1 });
          mobile.on('console', message => { if (message.type() === 'error') consoleErrors.push(`mobile: ${message.text()}`); });
          mobile.on('pageerror', error => consoleErrors.push(`mobile: ${error.message}`));
          await mobile.goto('http://127.0.0.1:3100', { waitUntil: 'networkidle' });
          await mobile.getByText('BAD IDEA MACHINE', { exact: true }).first().waitFor();
          await mobile.getByRole('button', { name: /GARAGE MAYHEM/i }).click();
          await mobile.screenshot({ path: 'visual-smoke/mobile-garage-ready.png', fullPage: true });
          await mobile.getByRole('button', { name: /DO NOT PRESS/i }).click();
          await verifyMovingActor(mobile);
          await mobile.waitForFunction(() => document.querySelectorAll('.scene-particle').length >= 30, undefined, { timeout: 4_000 });
          await mobile.screenshot({ path: 'visual-smoke/mobile-garage-chaos.png', fullPage: true });

          if (consoleErrors.length > 0) throw new Error(`Browser errors:\n${consoleErrors.join('\n')}`);
          await browser.close();
          NODE

      - name: Upload visual smoke screenshots
        uses: actions/upload-artifact@v4
        with:
          name: bad-idea-machine-environment-visual-smoke
          path: sdk/casino-sdk/examples/bad-idea-machine/visual-smoke/*.png
          if-no-files-found: error
