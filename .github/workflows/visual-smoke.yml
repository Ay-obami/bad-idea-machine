name: Bad Idea Machine Visual Smoke

on:
  push:
    branches:
      - main
      - feat/bad-idea-machine-game
      - feat/chaos-unpredictability-pass
      - feat/environment-scene-rebuild
      - feat/cinematic-reference-ui
    paths:
      - .github/workflows/visual-smoke.yml
      - sdk/casino-sdk/examples/bad-idea-machine/src/**
      - sdk/casino-sdk/examples/bad-idea-machine/public/**
      - sdk/casino-sdk/examples/bad-idea-machine/index.html

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/casino-sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install workspace
        run: npm install

      - name: Install Playwright for visual smoke
        shell: bash
        run: |
          cd examples/bad-idea-machine
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Build and serve standalone demo
        shell: bash
        run: |
          npm run build:bad-idea
          npm --prefix examples/bad-idea-machine run preview -- --host 127.0.0.1 > /tmp/bad-idea-preview.log 2>&1 &
          echo $! > /tmp/bad-idea-preview.pid
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3100 >/dev/null; then
              exit 0
            fi
            sleep 0.25
          done
          cat /tmp/bad-idea-preview.log
          exit 1

      - name: Capture cinematic rooms and verify physical actor motion
        shell: bash
        run: |
          cd examples/bad-idea-machine
          mkdir -p visual-smoke
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';

          const browser = await chromium.launch({ headless: true });
          const consoleErrors = [];

          function watchErrors(page, prefix = '') {
            page.on('console', message => {
              if (message.type() === 'error') consoleErrors.push(`${prefix}${message.text()}`);
            });
            page.on('pageerror', error => consoleErrors.push(`${prefix}${error.message}`));
          }

          async function verifyCinematicShell(page) {
            await page.locator('.cinematic-stage').waitFor();
            if (await page.locator('.outcome-preview').count() !== 5) throw new Error('Expected five persistent multiplier outcome cards');
            const photo = page.locator('.environment-stage .cinematic-backdrop__photo').first();
            const background = await photo.evaluate(node => getComputedStyle(node).backgroundImage);
            if (!background.includes('/cinematic/')) throw new Error(`Self-hosted cinematic photo backdrop missing: ${background}`);
            for (const asset of ['kitchen.webp', 'garage.webp', 'blast.webp']) {
              const response = await page.request.get(`http://127.0.0.1:3100/cinematic/${asset}`);
              if (!response.ok()) throw new Error(`Missing self-hosted cinematic asset ${asset}: ${response.status()}`);
            }
            if (await page.locator('.station').count() !== 0) throw new Error('Old station-card UI is still rendered');
          }

          async function activeActorBoxes(page) {
            const actorIds = [...new Set(await page.locator('[data-event-actor]').evaluateAll(nodes => nodes
              .map(node => node.getAttribute('data-event-actor'))
              .filter(Boolean)))];
            const boxes = new Map();
            for (const actorId of actorIds) {
              const box = await page.locator(`[data-scene-actor="${actorId}"]`).boundingBox();
              if (box) boxes.set(actorId, box);
            }
            return boxes;
          }

          async function verifyMovingActor(page) {
            await page.locator('.environment-stage[data-phase="revealing"]').waitFor({ timeout: 4_000 });
            if (await page.locator('.environment-result').count() !== 0) {
              throw new Error('Result became visible before catastrophe reveal completed');
            }
            await page.locator('[data-event-actor]').first().waitFor({ state: 'attached', timeout: 4_000 });

            let best = { id: 'none', distance: 0 };
            for (let attempt = 0; attempt < 12; attempt += 1) {
              const before = await activeActorBoxes(page);
              await page.waitForTimeout(190);
              const after = await activeActorBoxes(page);
              for (const [actorId, first] of before) {
                const second = after.get(actorId);
                if (!second) continue;
                const distance = Math.hypot(second.x - first.x, second.y - first.y);
                if (distance > best.distance) best = { id: actorId, distance };
                if (distance >= 18) return actorId;
              }
              await page.waitForTimeout(80);
            }
            throw new Error(`No active actor crossed the scene; best was ${best.id} at ${best.distance.toFixed(1)}px`);
          }

          async function verifyChaos(page) {
            await page.locator('.scene-vfx-layer').waitFor();
            await page.waitForFunction(
              () => document.querySelectorAll('.scene-particle').length >= 30,
              undefined,
              { timeout: 4_000 },
            );
            await page.waitForFunction(() => {
              const probes = [...document.querySelectorAll('[data-event-decoy]')];
              return probes.some(node => node.getAttribute('data-event-decoy') === 'true');
            }, undefined, { timeout: 6_500 });
            await page.waitForFunction(() => {
              const probes = [...document.querySelectorAll('[data-event-hazard]')];
              return probes.some(node => ['fire', 'blast'].includes(node.getAttribute('data-event-hazard') || ''));
            }, undefined, { timeout: 6_500 });
            await page.locator('.scene-flame, .scene-shockwave').first().waitFor({ timeout: 2_000 });
            if (await page.locator('.environment-result').count() !== 0) throw new Error('Result overlay leaked into active catastrophe');
          }

          async function waitForResult(page) {
            await page.locator('.environment-result').waitFor({ timeout: 9_000 });
            await page.getByText('WHAT WENT WRONG?', { exact: true }).waitFor({ timeout: 2_000 });
            const damage = await page.locator('.environment-stage .cinematic-backdrop').first().getAttribute('data-damage-state');
            if (!damage || damage === 'clean') throw new Error(`Result did not persist room damage: ${damage}`);
            if (await page.locator('.outcome-preview--selected').count() !== 1) throw new Error('Settled multiplier card was not highlighted');
          }

          async function verifyMobileControls(page) {
            const viewport = page.viewportSize();
            if (!viewport) throw new Error('Mobile viewport unavailable');

            const riskCards = page.locator('.cinematic-risk-selector .risk-card');
            if (await riskCards.count() !== 3) throw new Error('Expected three mobile risk cards');
            for (let index = 0; index < 3; index += 1) {
              const box = await riskCards.nth(index).boundingBox();
              if (!box) throw new Error(`Could not measure mobile risk card ${index}`);
              if (box.x < 0 || box.x + box.width > viewport.width + .5) {
                throw new Error(`Mobile risk card ${index} escapes viewport: x=${box.x.toFixed(1)}, width=${box.width.toFixed(1)}, viewport=${viewport.width}`);
              }
            }

            const wager = await page.locator('.cinematic-wager').boundingBox();
            const risks = await page.locator('.cinematic-risk-selector').boundingBox();
            const environment = await page.locator('.environment-selector').boundingBox();
            const launch = await page.locator('.cinematic-launch').boundingBox();
            if (!wager || !risks || !environment || !launch) throw new Error('Could not measure mobile control order');
            if (!(wager.y < risks.y && risks.y < environment.y && environment.y < launch.y)) {
              throw new Error(`Mobile control order regressed: wager=${wager.y.toFixed(1)}, risk=${risks.y.toFixed(1)}, environment=${environment.y.toFixed(1)}, launch=${launch.y.toFixed(1)}`);
            }
          }

          const page = await browser.newPage({ viewport: { width: 1440, height: 900 }, deviceScaleFactor: 1 });
          watchErrors(page);
          await page.goto('http://127.0.0.1:3100', { waitUntil: 'networkidle' });
          await page.getByText('BAD IDEA MACHINE', { exact: true }).first().waitFor();
          await verifyCinematicShell(page);
          await page.locator('.environment-stage[data-environment="kitchen"]').waitFor();
          await page.screenshot({ path: 'visual-smoke/kitchen-idle.png', fullPage: true });

          await page.getByRole('button', { name: /ABSOLUTELY NOT/i }).click();
          await page.getByRole('button', { name: /LAUNCH CHAOS/i }).click();
          console.log(`Kitchen moving actor: ${await verifyMovingActor(page)}`);
          await verifyChaos(page);
          await page.screenshot({ path: 'visual-smoke/kitchen-chaos.png', fullPage: true });
          await waitForResult(page);
          await page.screenshot({ path: 'visual-smoke/result.png', fullPage: true });

          await page.getByRole('button', { name: /GARAGE MAYHEM/i }).click();
          await page.locator('.environment-stage[data-environment="garage"][data-phase="idle"]').waitFor();
          await page.getByRole('button', { name: /LAUNCH CHAOS/i }).click();
          console.log(`Garage moving actor: ${await verifyMovingActor(page)}`);
          await verifyChaos(page);
          await page.screenshot({ path: 'visual-smoke/garage-chaos.png', fullPage: true });
          await waitForResult(page);

          const mobile = await browser.newPage({ viewport: { width: 390, height: 844 }, deviceScaleFactor: 1 });
          watchErrors(mobile, 'mobile: ');
          await mobile.goto('http://127.0.0.1:3100', { waitUntil: 'networkidle' });
          await mobile.getByText('BAD IDEA MACHINE', { exact: true }).first().waitFor();
          await verifyCinematicShell(mobile);
          await mobile.locator('.environment-stage[data-environment="kitchen"]').waitFor();
          await verifyMobileControls(mobile);
          await mobile.screenshot({ path: 'visual-smoke/mobile-idle.png', fullPage: true });
          await mobile.getByRole('button', { name: /LAUNCH CHAOS/i }).click();
          await verifyMovingActor(mobile);
          await mobile.waitForFunction(() => document.querySelectorAll('.scene-particle').length >= 30, undefined, { timeout: 4_000 });
          await mobile.screenshot({ path: 'visual-smoke/mobile-kitchen-chaos.png', fullPage: true });
          await waitForResult(mobile);

          await mobile.getByRole('button', { name: /GARAGE MAYHEM/i }).click();
          await mobile.locator('.environment-stage[data-environment="garage"][data-phase="idle"]').waitFor();
          await verifyMobileControls(mobile);
          await mobile.getByRole('button', { name: /LAUNCH CHAOS/i }).click();
          await verifyMovingActor(mobile);
          await mobile.waitForFunction(() => document.querySelectorAll('.scene-particle').length >= 30, undefined, { timeout: 4_000 });
          await mobile.screenshot({ path: 'visual-smoke/mobile-garage-chaos.png', fullPage: true });

          if (consoleErrors.length > 0) throw new Error(`Browser errors:\n${consoleErrors.join('\n')}`);
          await browser.close();
          NODE

      - name: Upload visual smoke screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bad-idea-machine-cinematic-visual-smoke
          path: sdk/casino-sdk/examples/bad-idea-machine/visual-smoke/*.png
          if-no-files-found: warn
